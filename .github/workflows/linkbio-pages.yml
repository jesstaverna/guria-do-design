name: Publicar link da bio

on:
  push:
    branches: [main, claude/intelligent-johnson-pkg8sd]
    paths: ["linkbio/**", ".github/workflows/linkbio-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: linkbio
      - id: deployment
        uses: actions/deploy-pages@v4
